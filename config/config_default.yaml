# ============================================================
#  ComfyUI 接口地址（可配多个，随机用；use_api 指定用第几个）
#  插件不在本机跑？改成能访问到的地址即可：
#     http://192.168.1.100:8188       局域网（换成你那台 ComfyUI 的 IP）
#     https://xxx.trycloudflare.com   走隧道（配合认证闸门那套）
# ============================================================
api_list:
  - baseurl: "http://127.0.0.1:8188"
    username: ""
    password: ""
use_api: 0

# ============================================================
#  当前使用的工作流模板：对应 config/workflows/<名字>.json
#  这个 json 必须是 ComfyUI 里「导出(API)」出来的格式
# ============================================================
workflow: "z-image-turbo"

# 节点定位（一般留空即可，插件会顺着 KSampler 的连线自己找）
# 只有当你的工作流结构特殊、插件认不出来时，才需要手填节点 id
node_map:
  positive: ""
  negative: ""
  sampler: ""
  latent: ""
  model: ""
  lora: ""
  image: ""

# 针对特定工作流的节点定位覆盖（一般不用动，插件已经为自带模板配好了）
# 说明：MiniMax 视频的提示词写在 MiniMaxH3* 节点上，不是 CLIPTextEncode，
#       所以这里要显式指明节点 id；带冒号的 id 表示「子图」里的节点
#       （105:104 = 子图 105 内部的编号 104），少了前缀会找不到节点
workflow_node_map:
  minimax-h3-t2v:
    positive: "105:104"
    sampler: "105:9"
  minimax-h3-i2v:
    positive: "105:104"
    sampler: "105:9"
    image: "114"
  minimax-h3-ref:
    positive: "136"
    sampler: "124"
    image: "137"

# 轮询设置
poll_interval: 2        # 秒：多久查一次是否出图
timeout: 900            # 秒：最长等多久
notify_interval: 60     # 秒：每隔多久在群里报一句“还在生成”（0 = 不打扰）

# 出图后的参数回执，三选一：
#   full = 附一张参数卡片（提示词、种子、步数…，含本次耗时）
#   time = 只回一句「出图完成，耗时 X 秒」
#   none = 什么都不发
# 群里也能改：#出图参数 完整 / 耗时 / 关闭     （老配置写 true/false 也认）
reply_params: full

# 中文提示词自动翻译成英文（百度翻译，不填就原样使用）
translate:
  appid: ""
  appkey: ""

# 出图内容检查（可选，默认关闭）
nsfw_check:
  enable: false
  url: ""
  apikey: ""

# ============================================================
#  使用白名单：开了以后只有名单里的群 / 人能用这个插件
#    enable: false（默认）不做任何限制，行为和没配一样
#    群聊只看 groups，私聊只看 users，互不干扰
#    机器人主人始终放行，不会把自己锁在外面
#  群聊里发 #绘图白名单 可以看和改（只有主人能改）
# ============================================================
whitelist:
  enable: false
  groups: []       # 允许使用的群号，例如 - [123456789]
  users: []        # 允许私聊使用的 QQ，例如 - [123456789]
  # 被拦下时怎么处理：false = 完全不回复（默认，安静）；
  # 想看是哪个群被拦了、要群号，就设成 true（会回一句带群号的提示）
  reply: false
